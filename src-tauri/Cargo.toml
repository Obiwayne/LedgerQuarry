[package]
name = "ledgerquarry"
version = "0.1.0"
description = "Private receipt and spending tracker: a desktop dashboard plus a phone app that reaches it over Tailscale, with receipts read by a local AI model."
authors = ["Obiwayne"]
license = "MIT"
repository = "https://github.com/Obiwayne/LedgerQuarry"
edition = "2021"
default-run = "ledgerquarry"

[lib]
name = "ledgerquarry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ledgerquarry"
path = "src/main.rs"

# Headless server for an always-on PC or home server (no window).
[[bin]]
name = "ledgerquarry-server"
path = "src/bin/server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["limit"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
rust-embed = "8"
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
